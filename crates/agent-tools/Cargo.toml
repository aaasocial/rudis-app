[package]
name = "agent-tools"
version = "0.1.0"
edition = "2021"
description = "Rudis shared agent tool-schema source (Phase 16, TOOL-06/D-01): the ONE authored list of ToolDef JSON schemas + the parse_edit_tool boundary into rudis_core::tools::Tool, consumed by both crates/agent-llm (in-app agent) and crates/agent-mcp (MCP dev harness) so neither hand-authors schemas independently."
publish = false
license.workspace = true

[dependencies]
core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

